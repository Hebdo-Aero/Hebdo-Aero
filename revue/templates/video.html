<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Big Shoulders"; font-weight: 700; src: url("{{ polices }}/BigShoulders-Bold.woff") format("woff"); }
@font-face { font-family: "Big Shoulders"; font-weight: 400; src: url("{{ polices }}/BigShoulders-Regular.woff") format("woff"); }
@font-face { font-family: "Instrument Sans"; font-weight: 400; src: url("{{ polices }}/InstrumentSans-Regular.woff") format("woff"); }
@font-face { font-family: "Instrument Sans"; font-weight: 700; src: url("{{ polices }}/InstrumentSans-Bold.woff") format("woff"); }

/* Calque graphique transparent posé sur les images filmées (ou le ciel généré). */
:root {
  --nuit: #0B1A2E;
  --orange: #FF6A1F;
  --soleil: #FFB627;
  --ciel: #3FA9F5;
  --blanc: #FFFFFF;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
body { position: relative; color: var(--blanc); font-family: "Instrument Sans", Arial, sans-serif;
       -webkit-font-smoothing: antialiased; }

/* Voile de lisibilité : plus sombre en haut (route) et en bas (sous-titres) */
#voile { position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(11,26,46,.82) 0%, rgba(11,26,46,.35) 22%, rgba(11,26,46,.30) 46%,
                                      rgba(11,26,46,.55) 62%, rgba(11,26,46,.88) 100%); }
/* Fond opaque pour la scène du chiffre */
#plein { position: absolute; inset: 0; opacity: 0;
  background: radial-gradient(110% 45% at 80% 105%, rgba(255,106,31,.6), rgba(255,106,31,0) 70%),
              linear-gradient(180deg, #0B1A2E 0%, #13294A 75%, #22305A 100%); }

#route { position: absolute; left: 0; top: 250px; width: 1080px; height: 190px; }
#marque { position: absolute; left: 90px; top: 448px; display: flex; align-items: center; gap: 18px;
          font-family: "Big Shoulders"; font-weight: 700; font-size: 40px; color: var(--soleil);
          text-shadow: 0 2px 12px rgba(0,0,0,.5); }
#marque img { height: 64px; }

.scene { position: absolute; left: 90px; width: 830px; top: 530px; opacity: 0; }
.surtitre { display: inline-block; font-weight: 700; font-size: 38px; color: var(--nuit); background: var(--orange);
            padding: 6px 20px 7px; border-radius: 999px; margin-bottom: 24px; }
.titre { font-family: "Big Shoulders"; font-weight: 700; font-size: 128px; line-height: .96; letter-spacing: -.005em;
         text-shadow: 0 4px 28px rgba(0,0,0,.55); }
.texte { font-size: 46px; line-height: 1.28; margin-top: 26px; font-weight: 700; color: #F1F5FA;
         text-shadow: 0 2px 16px rgba(0,0,0,.6); }
.scene.chiffre .titre { font-size: 300px; line-height: .9; color: var(--soleil); }
.scene.intro .titre, .scene.fin .titre { font-size: 150px; }
.scene.intro .surtitre, .scene.fin .surtitre, .scene.appel .surtitre { background: var(--ciel); }
.scene.appel .titre { font-size: 150px; }
.scene.appel .texte { font-family: "Big Shoulders"; font-size: 84px; color: var(--soleil); }
/* Accroche : texte géant, lisible dès la première image */
.scene.accroche { top: 600px; }
.scene.accroche .surtitre { background: var(--soleil); }
.scene.accroche .titre { font-size: 210px; line-height: .9; color: var(--blanc); }
.scene.accroche .texte { display: none; }
.scene.fin .texte { font-family: "Big Shoulders"; font-size: 70px; white-space: nowrap; color: var(--soleil); }
.embleme { display: block; width: 230px; height: 230px; margin: -40px 0 30px; filter: drop-shadow(0 8px 30px rgba(0,0,0,.5)); }

/* Générique d'ouverture */
#ident { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
         justify-content: center; opacity: 0; transform-origin: 50% 46%; }
#ident .emb { width: 560px; height: 560px; position: relative; }
#ident .emb svg { width: 100%; height: 100%; overflow: visible; display: block; }
#ident .onde { position: absolute; inset: 0; border-radius: 50%; border: 6px solid var(--soleil); opacity: 0; }
#ident .nom { position: relative; margin-top: 54px; }
#ident .nom span { display: block; font-family: "Big Shoulders"; font-weight: 700; font-size: 200px; line-height: .9;
                   letter-spacing: .01em; transform: skewX(-9deg); text-shadow: 0 6px 40px rgba(0,0,0,.45); }
#ident .nom svg { position: absolute; left: 8px; bottom: -34px; width: 560px; height: 30px; overflow: visible; }
#ident .tag1 { margin-top: 64px; font-size: 40px; color: #DCE6F2; }
#ident .tag2 { margin-top: 26px; display: flex; gap: 18px; align-items: center; font-size: 40px; color: #C9D6E6; }
#ident .tag2 b { font-family: "Big Shoulders"; font-size: 48px; color: var(--nuit); background: var(--orange);
                 padding: 2px 22px 0; border-radius: 999px; }
.scene.intro { display: none; }

/* Sous-titres mot à mot */
#st { position: absolute; left: 70px; width: 860px; top: 1190px; height: 230px; display: flex;
      align-items: center; justify-content: center; text-align: center; }
#st p { font-weight: 700; font-size: 64px; line-height: 1.16; letter-spacing: -.005em;
        text-shadow: 0 0 2px #000, 0 4px 18px rgba(0,0,0,.85); transform-origin: 50% 60%; }
#st span { color: rgba(255,255,255,.96); }
#st span.on { color: var(--soleil); }

/* Mention « Collaboration commerciale » (partenaire), affichée pendant toute la vidéo */
#pub { position: absolute; left: 90px; top: 176px; display: none; font-weight: 700; font-size: 30px; letter-spacing: .02em;
       color: #fff; background: rgba(11,26,46,.72); border: 2px solid rgba(255,255,255,.35); padding: 6px 18px 7px; border-radius: 999px; }
.partenaire { margin-top: 30px; font-size: 40px; font-weight: 700; color: #DCE6F2; text-shadow: 0 2px 14px rgba(0,0,0,.6); }
#credit { position: absolute; left: 90px; top: 1440px; font-size: 26px; color: rgba(255,255,255,.72);
          text-shadow: 0 1px 6px rgba(0,0,0,.8); }
</style>
</head>
<body>
<div id="voile"></div>
<div id="plein"></div>
<svg id="route" viewBox="0 0 1080 190">
  <path id="trace" d="M90 150 Q540 10 990 150" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="5"
        stroke-dasharray="14 14" stroke-linecap="round"/>
  <path id="parcouru" d="M90 150 Q540 10 990 150" fill="none" stroke="var(--orange)" stroke-width="7" stroke-linecap="round"/>
  <g id="balises"></g>
  <g id="avion">
    <path d="M0 -26 L6 -8 L28 4 L28 10 L6 4 L4 18 L12 24 L12 28 L0 25 L-12 28 L-12 24 L-4 18 L-6 4 L-28 10 L-28 4 L-6 -8 Z"
          fill="var(--blanc)"/>
  </g>
</svg>
<div id="marque"><img src="{{ logo }}" alt=""><span></span></div>
<div id="ident">
  <div class="emb">{{ embleme_svg|safe }}<div class="onde"></div></div>
  <div class="nom"><span></span>
    <svg viewBox="0 0 560 30"><path id="trait" d="M4 22 L520 6 L506 28 Z" fill="var(--orange)"/></svg></div>
  <p class="tag1"></p>
  <p class="tag2"><b></b><span></span></p>
</div>
<div id="scenes"></div>
<div id="st"><p></p></div>
<div id="credit"></div>
<div id="pub"></div>

<script>
let S = [], T = [], ST = [], LONGUEUR = 0, morceauCourant = -1, DIRECT = false;
const trace = () => document.getElementById("parcouru");
function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; }
function ajuster(e, hauteurMax, taille, mini) {
  e.style.fontSize = taille + "px";
  while (e.scrollHeight > hauteurMax && taille > mini) { taille -= 4; e.style.fontSize = taille + "px"; }
}

function preparer(d) {
  S = d.scenes; T = d.temps; ST = d.soustitres; DIRECT = !!d.direct;
  if (d.publicite) { const pub = document.getElementById("pub"); pub.textContent = d.publicite; pub.style.display = "block"; }
  preparerIdent(d);
  document.querySelector("#marque span").textContent = d.marque;
  const conteneur = document.getElementById("scenes");
  S.forEach(s => {
    const b = el("section", "scene " + s.type);
    if (s.type === "intro" || s.type === "fin" || s.type === "appel") { const e = el("img", "embleme"); e.src = "{{ embleme }}"; b.append(e); }
    b.append(el("p", "surtitre", s.surtitre), el("h1", "titre", s.titre_ecran), el("p", "texte", s.texte_ecran));
    if (s.partenaire) b.append(el("p", "partenaire", s.partenaire));
    conteneur.append(b);
  });
  document.querySelectorAll(".scene").forEach((b, i) => {
    b.style.opacity = 1;
    const titre = b.querySelector(".titre"), texte = b.querySelector(".texte");
    ajuster(titre, S[i].type === "chiffre" ? 320 : (S[i].type === "accroche" ? 520 : 400), parseFloat(getComputedStyle(titre).fontSize), 72);
    ajuster(texte, S[i].type === "chiffre" ? 240 : 130, parseFloat(getComputedStyle(texte).fontSize), 34);
    if (S[i].type === "fin") {
      let t = parseFloat(getComputedStyle(texte).fontSize);
      while (texte.scrollWidth > 860 && t > 30) { t -= 2; texte.style.fontSize = t + "px"; }
    }
    b.style.opacity = 0;
  });
  const p = trace(); LONGUEUR = p.getTotalLength();
  const g = document.getElementById("balises");
  S.forEach((_, i) => {
    const pt = p.getPointAtLength(LONGUEUR * i / (S.length - 1));
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", pt.x); c.setAttribute("cy", pt.y); c.setAttribute("r", 9);
    c.setAttribute("fill", "var(--nuit)"); c.setAttribute("stroke", "var(--ciel)"); c.setAttribute("stroke-width", 4);
    g.append(c);
  });
  p.style.strokeDasharray = LONGUEUR; p.style.strokeDashoffset = LONGUEUR;
}

const lisse = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const arrondi = x => Math.round(x * 100) / 100;

function seek(t) {
  let i = T.findIndex(x => t >= x.debut && t < x.fin); if (i < 0) i = S.length - 1;
  const x = T[i], local = t - x.debut, reste = x.fin - t, s = S[i];
  // en format court, la première scène est pleinement visible dès la première image
  const entree = (DIRECT && i === 0) ? 1 : arrondi(lisse(local / 0.5)), sortie = i === S.length - 1 ? 1 : arrondi(lisse(reste / 0.3));
  document.querySelectorAll(".scene").forEach((b, j) => { if (j !== i) b.style.opacity = 0; });
  const b = document.querySelectorAll(".scene")[i];
  b.style.opacity = Math.min(entree, sortie);
  b.querySelector(".titre").style.transform = `translateY(${(1 - entree) * 46}px)`;
  const entreeTexte = (DIRECT && i === 0) ? 1 : arrondi(lisse((local - 0.15) / 0.5));
  b.querySelector(".texte").style.opacity = Math.min(entreeTexte, sortie);

  const identVisible = s.type === "intro" ? animerIdent(local, x.fin - x.debut) : 0;
  document.getElementById("ident").style.opacity = identVisible;
  // fond opaque pour le générique et le chiffre de la semaine (fondu enchaîné)
  const plein = s.type === "intro" ? FOND_IDENT : s.type === "chiffre" ? Math.min(arrondi(lisse(local / 0.35)), i === S.length - 1 ? 1 : arrondi(lisse(reste / 0.35))) : 0;
  document.getElementById("plein").style.opacity = plein;
  document.getElementById("marque").style.opacity = (s.type === "intro" || s.type === "fin" || s.type === "appel") ? 0 : 1;
  document.getElementById("credit").textContent = s.type === "intro" ? "" : (s.credit || "");
  document.getElementById("route").style.opacity = s.type === "intro" ? 0 : 1;

  const prog = (DIRECT && i === 0) ? 1 : arrondi(lisse(local / 0.9));
  const a = Math.max(0, i - 1 + prog) / (S.length - 1);
  const p = trace(), pt = p.getPointAtLength(LONGUEUR * a), pt2 = p.getPointAtLength(Math.min(LONGUEUR, LONGUEUR * a + 2));
  const angle = Math.atan2(pt2.y - pt.y, pt2.x - pt.x) * 180 / Math.PI + 90;
  document.getElementById("avion").setAttribute("transform", `translate(${pt.x} ${pt.y}) rotate(${a >= 1 ? 90 : angle})`);
  p.style.strokeDashoffset = LONGUEUR * (1 - a);

  // sous-titres : un groupe de mots à la fois, le mot prononcé en jaune
  const k = s.type === "intro" ? -1 : ST.findIndex(m => t >= m.debut && t < m.fin);
  const para = document.querySelector("#st p");
  if (k !== morceauCourant) {
    para.innerHTML = "";
    if (k >= 0) ST[k].mots.forEach((m, j) => { const sp = el("span", "", m.m); para.append(sp, document.createTextNode(" ")); });
    morceauCourant = k;
  }
  let actif = -1, pop = 1;
  if (k >= 0) {
    ST[k].mots.forEach((m, j) => { if (t >= m.t) actif = j; });
    para.querySelectorAll("span").forEach((sp, j) => sp.className = j === actif ? "on" : "");
    pop = arrondi(0.94 + 0.06 * lisse((t - ST[k].debut) / 0.12));
    para.style.transform = `scale(${pop})`;
  }
  return [i, entree, sortie, entreeTexte, prog, plein, k, actif, pop, s.type === "intro" ? arrondi(local * 30) : ""].join("|");
}

// --- Générique : l'anneau se dessine, le ciel s'ouvre, le jet arrive (impact à 1,2 s), puis le nom ---
const IMPACT = {{ impact }};
let FOND_IDENT = 1, JET = null, TRAINEES = null, ANNEAU = null, CIEL = [], LONG_ANNEAU = 691, LONG_TRAIT = 1100;
function preparerIdent(d) {
  const intro = d.scenes[0];
  if (!intro || intro.type !== "intro") return;
  document.querySelector("#ident .nom span").textContent = (intro.titre_ecran || "").toUpperCase();
  document.querySelector("#ident .tag1").textContent = d.sous_titre || "";
  document.querySelector("#ident .tag2 b").textContent = intro.surtitre || "";
  document.querySelector("#ident .tag2 span").textContent = intro.texte_ecran || "";
  const svg = document.querySelector("#ident .emb svg"), ns = "http://www.w3.org/2000/svg";
  const jet = svg && svg.querySelector(".jet");
  if (!jet || !svg.querySelector(".anneau")) { STATIQUE = true; return; }   // ancien logo : générique sans animation fine
  JET = document.createElementNS(ns, "g"); jet.parentNode.insertBefore(JET, jet); JET.appendChild(jet);
  TRAINEES = svg.querySelector(".trainees");
  ANNEAU = svg.querySelector(".anneau");
  LONG_ANNEAU = ANNEAU.getTotalLength(); ANNEAU.style.strokeDasharray = LONG_ANNEAU;
  CIEL = [svg.querySelector(".ciel"), svg.querySelector(".horizon"), svg.querySelector(".fond")].filter(Boolean);
  CIEL.forEach(e => { e.style.transformOrigin = "128px 128px"; e.style.transformBox = "view-box"; });
  const trait = document.getElementById("trait");
  LONG_TRAIT = trait.getTotalLength(); trait.style.strokeDasharray = LONG_TRAIT;
}
const sortieDouce = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
let STATIQUE = false;
function animerIdent(t, duree) {
  if (!JET) {   // repli : simple fondu de l'écusson et du nom
    const fin = Math.min(1, Math.max(0, (t - (duree - 0.5)) / 0.5));
    FOND_IDENT = 1 - fin;
    return STATIQUE ? Math.min(Math.min(1, t / 0.6), 1 - fin) : 0;
  }
  const p = (a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
  // fond et anneau
  const trace = p(0.05, IMPACT - 0.1);
  ANNEAU.style.strokeDasharray = trace >= 1 ? "none" : `${LONG_ANNEAU} ${LONG_ANNEAU}`;
  ANNEAU.style.strokeDashoffset = LONG_ANNEAU * (1 - sortieDouce(trace));
  const ouverture = sortieDouce(p(0.1, 0.9));
  CIEL.forEach(e => { e.style.transform = `scale(${0.55 + 0.45 * ouverture})`; e.style.opacity = ouverture; });
  // le jet arrive du bas à gauche et se pose pile sur l'impact
  const vol = sortieDouce(p(0.3, IMPACT));
  JET.setAttribute("transform", `translate(${-210 * (1 - vol)} ${210 * (1 - vol)})`);
  JET.style.opacity = p(0.3, 0.45);
  TRAINEES.style.opacity = p(IMPACT - 0.4, IMPACT + 0.3);
  // onde de choc à l'impact
  const onde = p(IMPACT, IMPACT + 0.7);
  const o = document.querySelector("#ident .onde");
  o.style.opacity = onde > 0 && onde < 1 ? (1 - onde) * 0.9 : 0;
  o.style.transform = `scale(${1 + 0.55 * sortieDouce(onde)})`;
  // le nom se dévoile de gauche à droite, puis la traînée orange se dessine
  const nom = sortieDouce(p(IMPACT + 0.08, IMPACT + 0.6));
  const span = document.querySelector("#ident .nom span");
  span.style.clipPath = `inset(-20% ${100 - 100 * nom}% -20% -5%)`;
  span.style.transform = `skewX(-9deg) translateX(${-40 * (1 - nom)}px)`;
  const trait = document.getElementById("trait");
  trait.style.fill = p(IMPACT + 0.85, IMPACT + 0.9) >= 1 ? "var(--orange)" : "none";
  trait.style.stroke = "var(--orange)"; trait.style.strokeWidth = 3;
  trait.style.strokeDashoffset = LONG_TRAIT * (1 - sortieDouce(p(IMPACT + 0.35, IMPACT + 0.85)));
  // accroches textuelles
  const t1 = sortieDouce(p(IMPACT + 0.55, IMPACT + 1.0)), t2 = sortieDouce(p(IMPACT + 0.75, IMPACT + 1.2));
  const tag1 = document.querySelector("#ident .tag1"), tag2 = document.querySelector("#ident .tag2");
  tag1.style.opacity = t1; tag1.style.transform = `translateY(${24 * (1 - t1)}px)`;
  tag2.style.opacity = t2; tag2.style.transform = `translateY(${24 * (1 - t2)}px)`;
  // sortie : léger zoom et fondu vers les news
  const fin = p(duree - 0.5, duree);
  document.getElementById("ident").style.transform = `scale(${1 + 0.07 * fin})`;
  FOND_IDENT = 1 - fin;
  return Math.min(p(0, 0.25), 1 - fin);
}
</script>
</body>
</html>
