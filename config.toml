# Configuration de « Hebdo Aero »
# Tout ce qui se règle sans toucher au code se trouve ici.

[site]
nom = "Hebdo Aero"
# Le nom tel que la voix de synthèse doit le prononcer dans les vidéos.
nom_parle = "Hebdo Aéro"
sous_titre = "La revue hebdomadaire de l'aviation commerciale"
# Adresse publique du site. Laissez vide : GitHub Actions la remplit tout seul
# avec l'adresse GitHub Pages. Renseignez-la si vous utilisez un domaine à vous.
url = ""
langue = "fr"
fuseau = "Europe/Paris"
contact = ""  # adresse e-mail affichée pour signaler une erreur (facultatif)

[redaction]
# Modèle Claude utilisé pour rédiger la revue et les textes des réseaux sociaux.
modele = "claude-sonnet-5-5"
# Nombre maximum de recherches web que Claude peut faire pour compléter les flux RSS
# (10 $ les 1 000 recherches, soit 0,08 $ pour 8).
recherches_web_max = 8
# Nombre de brèves visées en plus des 3 sujets « À la une ».
breves_cible = 12
# En dessous de ce nombre d'articles valides, la revue n'est pas publiée.
articles_minimum = 6

# Flux RSS lus chaque semaine. Ajoutez ou retirez des lignes librement.
# Un flux qui ne répond pas est simplement ignoré.
[[flux]]
nom = "AeroTime"
url = "https://www.aerotime.aero/feed"

[[flux]]
nom = "Le Journal de l'Aviation"
url = "https://www.journal-aviation.com/feed"

[[flux]]
nom = "Aerobuzz"
url = "https://www.aerobuzz.fr/feed/"

[[flux]]
nom = "AirlineGeeks"
url = "https://airlinegeeks.com/feed/"

[[flux]]
nom = "Aviation24.be"
url = "https://www.aviation24.be/feed/"

[[flux]]
nom = "AeroRoutes"
url = "https://www.aeroroutes.com/?format=rss"

[[flux]]
nom = "Simple Flying"
url = "https://simpleflying.com/feed/"

[[flux]]
nom = "Air Journal"
url = "https://www.air-journal.fr/feed"

[video]
# Voix Google Cloud Text-to-Speech (Chirp 3 HD). Pour les écouter toutes et choisir,
# lancez l'action « Écouter les voix disponibles » puis ouvrez la page /voix/ du site.
voix = "fr-FR-Chirp3-HD-Sulafat"
vitesse = 1.0
# Durée maximale : les Reels Facebook publiés par API sont limités à 90 secondes.
duree_max = 88
images_par_seconde = 30
# Plans vidéo d'illustration (Pexels) pour l'ouverture et la conclusion.
recherche_intro = "airplane takeoff sunset"
recherche_fin = "airplane above clouds"
# Musique : votre fichier libre de droits s'il existe, sinon une nappe générée automatiquement.
musique = "assets/musique.mp3"
volume_musique = 0.32
# Léger souffle sonore à chaque changement de scène (0 pour le couper).
volume_transitions = 0.35

[illustrations]
# Photo libre de droits (Pixabay ou Pexels) en ouverture de chaque numéro. Les sujets « À la une » gardent
# leur vignette dessinée : une photo générique montre souvent un autre avion ou une autre compagnie.
# Mettez true pour leur donner quand même une photo.
photos_sujets = false

[reseaux]
# Mettez false pour couper une plateforme sans retirer ses secrets.
youtube = true
instagram = true
facebook = true
threads = true
# Visibilité des vidéos YouTube : "public", "unlisted" (non répertoriée) ou "private".
youtube_visibilite = "public"
# Signale à YouTube que la vidéo utilise une voix de synthèse.
youtube_contenu_synthetique = true
hashtags = ["aviation", "aeronautique", "avgeek", "compagniesaeriennes", "transportaerien"]
# Version de l'API Graph de Meta (Instagram et Facebook).
meta_version_api = "v25.0"

# Adresses de vos pages, affichées sur le site (laissez vide pour masquer).
[reseaux.profils]
youtube = ""
instagram = ""
facebook = ""
threads = ""

# ======================================================================
# Revenus : newsletter, partenaires, soutien, statistiques, mentions légales
# Chaque section est facultative : vide, elle n'affiche rien.
# ======================================================================

[newsletter]
# Formulaire d'inscription : l'adresse « action » du formulaire HTML de votre compte Kit
# (Kit > Grow > Landing Pages & Forms > votre formulaire > Publish > HTML).
formulaire = ""                  # ex. "https://app.kit.com/forms/1234567/subscriptions"
champ_email = "email_address"
prestataire = "Kit"
# Envoi automatique du numéro chaque dimanche (secret KIT_API_KEY), heure de Paris.
heure_envoi = "08:30"
# En dessous de ce nombre, le nombre d'abonnés n'est pas affiché sur la page « Annoncer ».
seuil_affichage_abonnes = 100

[soutien]
# Page de dons (Tipeee, Ko-fi, Buy Me a Coffee…). Laissez vide pour masquer le bouton.
url = ""                         # ex. "https://fr.tipeee.com/hebdo-aero"
plateforme = ""                  # ex. "Tipeee"
texte = ""                       # phrase facultative ; sinon un texte par défaut

[statistiques]
# Mesure d'audience sans cookie : "cloudflare" (gratuit), "goatcounter" ou "umami".
fournisseur = ""
identifiant = ""                 # cloudflare : le jeton du site ; goatcounter : le nom du compte ; umami : l'id du site
# Chiffres affichés sur la page « Annoncer » (0 pour masquer). À mettre à jour de temps en temps.
visites_par_mois = 0
abonnes_reseaux = 0
vues_videos_par_mois = 0

[annonceurs]
tarif = ""                       # ex. "à partir de 50 € le numéro" ; vide : « sur demande »

[publicite]
# Google AdSense. Votre identifiant d'éditeur « ca-pub-… » (AdSense > Compte > Informations sur le compte).
# Les annonces automatiques s'activent dans AdSense (Annonces > Par site). Elles ne s'affichent que sur les pages
# éditoriales (accueil, numéros, archives, à propos), jamais sur les pages de service.
adsense = ""                     # ex. "ca-pub-1234567890123456"
# Blocs placés à la main, facultatifs : identifiant « data-ad-slot » d'un bloc créé dans AdSense > Annonces > Par bloc.
bloc_numero = ""                 # après « À la une »
bloc_breves = ""                 # au milieu des brèves
# Pas d'annonces Google sur les pages d'un numéro qui a un partenaire de la semaine (exclusivité vendue au sponsor).
masquer_avec_partenaire = true

[editeur]
# Mentions légales : obligatoires dès que le site rapporte de l'argent.
nom = ""                         # vos prénom et nom, ou le nom de votre entreprise
statut = ""                      # ex. "entrepreneur individuel (micro-entreprise)"
siret = ""
adresse = ""                     # adresse postale (une domiciliation est possible)
telephone = ""
directeur_publication = ""       # en général vous-même
pays = "France"                  # pays où vous résidez : France, Luxembourg, Belgique ou Suisse

# Partenaires (sponsors) : un bloc par partenaire. Il apparaît, signalé comme publicité,
# dans les numéros dont la date (le dimanche) est comprise entre « du » et « au ».
# Retirez les # devant les lignes pour activer l'exemple.
# [[partenaires]]
# nom = "École Exemple"
# texte = "Formez-vous aux métiers de l'aérien : portes ouvertes le 15 novembre."
# lien = "https://exemple.fr/portes-ouvertes"
# bouton = "Découvrir"
# logo = ""                      # facultatif : fichier déposé dans assets/partenaires/, ou adresse https
# du = 2026-10-18
# au = 2026-11-08
# video = true                   # mention dans la vidéo de la semaine (à l'écran et à la voix)
